<div class="flex flex-col gap-1 w-full">
  @if (config().label) {
  <label [for]="inputId()" class="text-sm font-medium text-gray-700 capitalize">{{
    config().label
    }}</label>
  }

  <div class="relative w-full border-1 border-gray-300 p-1" [class.border-red-500]="showError()">
    <input pInputText [id]="inputId()" [type]="isPassword() ? (showPassword() ? 'text' : 'password') : config().type"
      [formField]="field()" [placeholder]="config().placeholder"
      [attr.aria-describedby]="showError() ? inputId() + '-errors' : null" [attr.aria-invalid]="showError()"
      class="custom-form-input w-full" [class.pr-10]="isPassword()" />

    @if (isPassword()) {
    <button type="button" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm"
      (click)="togglePassword()">
      @if (showPassword()) {
      <lucide-icon name="eye" [size]="15"></lucide-icon>
      } @else {
      <lucide-icon name="eye-off" [size]="15"></lucide-icon>
      }
    </button>
    }
  </div>

  @if (showError()) {
  <div [id]="inputId() + '-errors'" class="flex flex-col gap-1" aria-live="polite">
    @for (error of field()().errors(); track error.kind) {
    <small class="text-red-500 text-xs">{{ error.message }}</small>
    }
  </div>
  }

  @if (config().hint && !showError()) {
  <small class="text-gray-400 text-xs">{{ config().hint }}</small>
  }
</div>
