<div (click)="onCardClick()"
  class="relative h-130 w-full overflow-hidden rounded-2xl shadow-md hover:shadow-2xl transition-all duration-500 group cursor-pointer bg-slate-900">
  <img [src]="diploma().image" [alt]="diploma().title"
    class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" />

  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent pointer-events-none"></div>
  <div
    class="m-2 rounded-2xl absolute bottom-0 inset-x-0 bg-site-primary/95 text-white p-4 md:p-5 transition-all duration-500 ease-in-out translate-y-[calc(100%-5.5rem)] group-hover:translate-y-0 backdrop-blur-xs flex flex-col justify-start">
    <h3 class="text-lg md:text-xl font-bold tracking-tight text-white flex-shrink-0 h-14 flex items-center line-clamp-2">
      {{ diploma().title }}
    </h3>
    <div class="pt-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100">
      <p class="text-xs md:text-sm text-blue-50/90 leading-relaxed">
        {{ diploma().description }}
      </p>
    </div>
  </div>
</div>
