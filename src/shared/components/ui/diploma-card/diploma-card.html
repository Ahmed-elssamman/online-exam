<div (click)="onCardClick()"
  class="relative h-104 w-full overflow-hidden rounded-2xl shadow-md hover:shadow-2xl transition-all duration-300 group cursor-pointer  bg-slate-900">
  <img [src]="diploma().imageUrl" [alt]="diploma().title"
    class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" />
  <div *ngIf="diploma().badge"
    class="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-amber-400 text-slate-900 font-black text-sm flex items-center justify-center shadow-md border-2 border-white">
    {{ diploma().badge }}
  </div>

  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent pointer-events-none"></div>
  <div
    class="m-2 rounded-2xl absolute bottom-0 inset-x-0 bg-site-primary/95 text-white p-5 md:p-6 transition-transform duration-500 ease-in-out translate-y-[calc(100%-6.5rem)] group-hover:translate-y-0 backdrop-blur-xs flex flex-col justify-start">
    <h3 class="text-xl md:text-2xl font-bold tracking-tight mb-2 text-white flex-shrink-0">
      {{ diploma().title }}
    </h3>
    <p
      class="text-xs md:text-sm text-blue-50/90 leading-relaxed transition-all duration-300 line-clamp-1 group-hover:line-clamp-none">
      {{ diploma().description }}
    </p>
  </div>
</div>
