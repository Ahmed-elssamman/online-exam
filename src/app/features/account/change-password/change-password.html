<div class="max-w-6xl mx-auto w-full flex-1 flex flex-col">
  <div class="text-xs font-medium mb-3 shrink-0">
    <span class="text-slate-400">Account</span>
    <span class="text-slate-400 mx-1.5">/</span>
    <span class="text-site-primary font-semibold">Change Password</span>
  </div>
  <div class="flex items-center gap-3 mb-8 shrink-0">
    <button type="button" (click)="goBack()"
      class="w-12 h-12 flex items-center justify-center rounded-lg border border-blue-200 text-site-primary hover:bg-blue-50 transition cursor-pointer bg-white shrink-0"
      aria-label="Back">
      <lucide-icon name="chevron-left" [size]="22"></lucide-icon>
    </button>
    <div class="flex-1 h-12 bg-site-primary rounded-lg flex items-center px-6 gap-3 text-white shadow-xs">
      <lucide-icon name="user" [size]="22"></lucide-icon>
      <h1 class="text-lg font-bold tracking-wide">Account Settings</h1>
    </div>
  </div>
  <div class="flex flex-col lg:flex-row gap-8 items-stretch flex-1 pb-4">
    <div class="w-full lg:w-64 flex-shrink-0 flex flex-col justify-between lg:min-h-[calc(100vh-12.5rem)]">
      <div class="flex flex-col gap-1.5">
        <a routerLink="/account"
          class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <lucide-icon name="user" [size]="18"></lucide-icon>
          <span>Profile</span>
        </a>
        <a routerLink="/account/change-password"
          class="flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm bg-[#EFF6FF] text-site-primary transition">
          <lucide-icon name="lock" [size]="18"></lucide-icon>
          <span>Change Password</span>
        </a>
      </div>

      <button (click)="onLogout()" type="button"
        class="w-fit flex items-center gap-2.5 px-5 py-2.5 rounded-lg text-sm font-semibold text-red-500 bg-[#FEF2F2] hover:bg-red-100 transition cursor-pointer mt-8 lg:mt-auto">
        <lucide-icon name="log-out" [size]="16"></lucide-icon>
        <span>Logout</span>
      </button>
    </div>
    <div class="flex-1 w-full max-w-3xl border-2 border-blue-500 rounded-lg p-6 sm:p-8 bg-white shadow-xs self-start">
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="text-sm font-semibold text-slate-800 mb-1.5 block">Current Password</label>
          <div class="relative flex items-center">
            <input [type]="showCurrent() ? 'text' : 'password'" [ngModel]="currentPassword()"
              (ngModelChange)="currentPassword.set($event)" name="currentPassword" placeholder="••••••••"
              class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-200 text-slate-800 text-sm focus:outline-none focus:border-site-primary focus:ring-1 focus:ring-site-primary transition" />
            <button type="button" (click)="showCurrent.set(!showCurrent())"
              class="absolute right-3 text-slate-400 hover:text-slate-600 cursor-pointer p-1"
              aria-label="Toggle password visibility">
              <lucide-icon [name]="showCurrent() ? 'eye' : 'eye-off'" [size]="18"></lucide-icon>
            </button>
          </div>
        </div>
        <div>
          <label class="text-sm font-semibold text-slate-800 mb-1.5 block">New Password</label>
          <div class="relative flex items-center">
            <input [type]="showNew() ? 'text' : 'password'" [ngModel]="newPassword()"
              (ngModelChange)="newPassword.set($event)" name="newPassword" placeholder="••••••••"
              class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-200 text-slate-800 text-sm focus:outline-none focus:border-site-primary focus:ring-1 focus:ring-site-primary transition" />
            <button type="button" (click)="showNew.set(!showNew())"
              class="absolute right-3 text-slate-400 hover:text-slate-600 cursor-pointer p-1"
              aria-label="Toggle password visibility">
              <lucide-icon [name]="showNew() ? 'eye' : 'eye-off'" [size]="18"></lucide-icon>
            </button>
          </div>
        </div>
        <div>
          <label class="text-sm font-semibold text-slate-800 mb-1.5 block">Confirm New Password</label>
          <div class="relative flex items-center">
            <input [type]="showConfirm() ? 'text' : 'password'" [ngModel]="confirmPassword()"
              (ngModelChange)="confirmPassword.set($event)" name="confirmPassword" placeholder="••••••••"
              class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-200 text-slate-800 text-sm focus:outline-none focus:border-site-primary focus:ring-1 focus:ring-site-primary transition" />
            <button type="button" (click)="showConfirm.set(!showConfirm())"
              class="absolute right-3 text-slate-400 hover:text-slate-600 cursor-pointer p-1"
              aria-label="Toggle password visibility">
              <lucide-icon [name]="showConfirm() ? 'eye' : 'eye-off'" [size]="18"></lucide-icon>
            </button>
          </div>
          @if (!passwordsMatch()) {
          <p class="text-xs text-red-500 font-medium mt-1">Passwords do not match</p>
          }
        </div>
        <button type="submit" [disabled]="isLoading() || !passwordsMatch()"
          class="w-full bg-site-primary hover:bg-site-primary-hover text-white font-semibold py-3 rounded-lg shadow-sm transition text-sm cursor-pointer disabled:opacity-50 mt-4">
          {{ isLoading() ? 'Updating Password...' : 'Update Password' }}
        </button>
      </form>
    </div>
  </div>
</div>
