<div class="max-w-7xl mx-auto space-y-6">
  <nav class="flex items-center gap-2 text-xs md:text-sm font-semibold text-slate-400">
    <a routerLink="/diplomas" class="hover:text-site-primary transition">Diplomas</a>
    <span>/</span>
    <span class="hover:text-site-primary cursor-pointer">{{diplomaTilte()}}</span>
    <span>/</span>
    <span class="text-site-primary">Exams</span>
  </nav>

  <div class="flex items-center gap-3 md:gap-4">
    <button type="button" (click)="goBack()"
      class="w-12 h-12 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl flex items-center justify-center text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-2xs cursor-pointer flex-shrink-0"
      aria-label="Go back">
      <lucide-icon name="chevron-left" [size]="22"></lucide-icon>
    </button>

    <div class="flex-1 bg-site-primary text-white p-4 md:p-5 rounded-2xl shadow-md flex items-center gap-3.5">
      <span class="text-2xl md:text-3xl">🎓</span>
      <h2 class="text-xl md:text-2xl font-bold tracking-tight">
        {{diplomaTilte()}} Exams
      </h2>
    </div>
  </div>

  <div class="space-y-4 pt-2">
    @for (exam of exams(); track exam.id) {
    <div
      class="group bg-site-card-bg border border-blue-100/70 rounded-2xl p-5 md:p-6 shadow-2xs hover:shadow-md transition-all duration-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-5">
      <div class="flex items-center gap-4 md:gap-5 flex-1 min-w-0">
        <div
          class="w-20 h-20 md:w-24 md:h-24 bg-white border border-blue-100 rounded-2xl flex items-center justify-center p-3 flex-shrink-0 shadow-2xs">
          <img [src]="exam.image" alt="" class="w-full h-full object-contain">
        </div>

        <div class="space-y-1">
          <h3 class="text-lg md:text-xl font-bold text-site-primary dark:text-blue-400">
            {{ exam.title }}
          </h3>
          <h5 class="text-xs md:text-sm text-slate-600 dark:text-slate-400">
            {{ exam.description }}
          </h5>
        </div>
      </div>

      <div class="flex flex-col items-start md:items-end justify-between gap-3 flex-shrink-0 w-full md:w-auto">
        <div class="flex items-center gap-4 text-xs font-mono font-semibold text-slate-600 dark:text-slate-400">
          <span class="flex items-center gap-1.5">
            <lucide-icon name="circle-question-mark" [size]="16" class="text-slate-500"></lucide-icon>
            {{ exam.questionsCount }} Questions
          </span>
          <span class="flex items-center gap-1.5">
            <lucide-icon name="clock" [size]="16" class="text-slate-500"></lucide-icon>
            {{ exam.duration }} minutes
          </span>
        </div>

        <div class="opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300">
          <site-btn [config]="startExamBtnConfig()" (fireBtn)="startExam(exam)"></site-btn>
        </div>
      </div>
    </div>
    }
  </div>
</div>
